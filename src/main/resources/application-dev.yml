spring:
  datasource:
    url: jdbc:h2:mem:bankingdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_UPPER=false
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  h2:
    console:
      enabled: true
      path: /h2-console

vaadin:
  exclude-urls:
    - /api/**
    - /h2-console/**
